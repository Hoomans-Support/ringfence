# One Blueprint for all of Ringfence (PRD, Render: "hosting only"): the API with the background
# worker's loop inside it, the hourly cron job, Postgres, and the investigator console. Sandbox only:
# the PayPal client refuses any other host. Every service deploys from the `ringfence` branch (`main`
# is gone); the Blueprint itself must sync from the same branch.
#
# Plans, chosen for cost: the API is on Render's free plan. It sleeps after 15 idle minutes and takes
# about a minute to wake on the next request; PayPal retries a webhook that times out, and the hourly
# cron sends and reconciles on its own, so nothing is lost while it sleeps. The worker's loop runs in
# the API (RINGFENCE_INLINE_WORKER) instead of a paid worker; apps/api/src/worker.ts still runs it as
# a separate process if that's ever wanted. Cron jobs have no free plan (billed per second, $1 a month
# minimum), and a free Postgres is deleted 30 days after creation, before judging ends, so both are paid.
#
# Secrets marked `sync: false` are asked for once, when the Blueprint is first created. RINGFENCE_API_KEY,
# RINGFENCE_MCP_KEY and ADMIN_TOKEN are generated; copy them from the API's Environment tab.

envVarGroups:
  - name: ringfence-paypal
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # The API and the cron each pace their own PayPal calls; at 4s apart they stay well under the
      # sandbox's 50 requests a minute between them.
      - key: PAYPAL_MIN_INTERVAL_MS
        value: "4000"
      # The sandbox's real cancel answers 500 INTERNAL_SERVICE_ERROR even on a processed batch's unclaimed
      # item (smoke run, 4 Nov 2026), as the PRD feared; its documented test ID POSPOI002 works. So cancels
      # use POSPOI002 and say so in the audit log, for the console to label. "false" tries the real cancel.
      - key: PAYPAL_CANCEL_WITH_TEST_IDS
        value: "true"

services:
  - type: web
    name: paypal-hackathon-service # the first deploy's name: keeps its URL and the webhook registered with PayPal
    runtime: node
    plan: free
    branch: ringfence
    buildCommand: npm ci --include=dev
    startCommand: npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    buildFilter:
      paths: ["apps/api/**", "packages/**", "db/**", "package.json", "package-lock.json"]
    envVars:
      - fromGroup: ringfence-paypal
      - key: DATABASE_URL
        fromDatabase: { name: ringfence-db, property: connectionString }
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RINGFENCE_PROGRAM_ID
        value: budgetapp
      # The demo program's numbering starts where the PRD's story does: its week 1 ring is R-12 and
      # the rule learned from it R-07 (DEMO_NUMBERING in apps/api/src/db.ts). A floor: it never moves a
      # program's numbering back. Remove both for a real program, which starts at 1.
      - key: RINGFENCE_FIRST_RING_NUMBER
        value: "12"
      - key: RINGFENCE_FIRST_RULE_NUMBER
        value: "7"
      - key: RINGFENCE_INLINE_WORKER # the outbox and polling loop, in this process
        value: "true"
      - key: RINGFENCE_API_KEY
        generateValue: true
      - key: RINGFENCE_SURVEY_PROGRAM_ID
        value: surveyapp
      - key: RINGFENCE_SURVEY_PROGRAM_NAME
        value: Survey app
      - key: RINGFENCE_SURVEY_API_KEY
        generateValue: true
      - key: PAYPAL_LOGIN_CLIENT_ID
        sync: false
      - key: PAYPAL_LOGIN_CLIENT_SECRET
        sync: false
      - key: RINGFENCE_SELF_RELEASE_KEY
        generateValue: true
      - key: RINGFENCE_SELF_RELEASE_REDIRECT_URL
        sync: false
      - key: RINGFENCE_MCP_KEY # read-only, for AI agents on POST /mcp
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

  - type: cron
    name: ringfence-reconcile
    runtime: node
    plan: 0.5c-512mb
    branch: ringfence
    schedule: "0 * * * *" # hourly: reconcile with PayPal, then sweep unclaimed fraud payouts into cancels
    buildCommand: npm ci --include=dev
    startCommand: npx tsx apps/api/src/cron.ts
    buildFilter:
      paths: ["apps/api/**", "packages/**", "db/**", "package.json", "package-lock.json"]
    envVars:
      - fromGroup: ringfence-paypal
      - key: DATABASE_URL
        fromDatabase: { name: ringfence-db, property: connectionString }
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # The investigator console (apps/console). Its demo weeks are fixture-driven; two pieces call the API
  # above with keys read from that service, never typed twice: Ring Watch (read-only MCP key) and the
  # survey app's live screening (the survey program's key). Free plan, so it sleeps like the API.
  - type: web
    name: ringfence-console
    runtime: node
    plan: free
    branch: ringfence
    buildCommand: npm ci --include=dev && npm run build -w @ringfence/console
    startCommand: npm start -w @ringfence/console
    buildFilter:
      paths: ["apps/console/**", "packages/**", "scripts/demo-generator/**", "fixtures/**", "package.json", "package-lock.json"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RINGFENCE_API_URL
        value: https://paypal-hackathon-service.onrender.com
      - key: RINGFENCE_MCP_KEY
        fromService: { type: web, name: paypal-hackathon-service, envVarKey: RINGFENCE_MCP_KEY }
      - key: RINGFENCE_SURVEY_API_KEY
        fromService: { type: web, name: paypal-hackathon-service, envVarKey: RINGFENCE_SURVEY_API_KEY }
      - key: AG_STUDIO # AG Studio licence key for the control tower's widgets
        sync: false
      - key: GEMINI_API_KEY # optional: the case file falls back to its scripted sentences without it
        sync: false

databases:
  - name: ringfence-db
    plan: 0.1c-256mb
    databaseName: ringfence
    user: ringfence
    postgresMajorVersion: "17"
    ipAllowList: [] # internal connections only: nothing outside Render can reach it
