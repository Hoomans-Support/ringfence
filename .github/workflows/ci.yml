# Every push: typecheck, the full test suite (engine, agents, API on PGlite, fire-drill bounds), and
# the fire drill's precision / recall / false-hold tables in the log (FR-23).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fire-drill
